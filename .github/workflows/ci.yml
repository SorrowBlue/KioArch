name: Lint, Test, and Build (main PR/push)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      run-lint: ${{ steps.check.outputs.run-lint }}
      run-unit: ${{ steps.check.outputs.run-unit }}
      run-ios: ${{ steps.check.outputs.run-ios }}
      run-instrumentation: ${{ steps.check.outputs.run-instrumentation }}
      run-build: ${{ steps.check.outputs.run-build }}
      run-cpp: ${{ steps.check.outputs.run-cpp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47.0.6
        with:
          files_yaml: |
            code:
              - '**'
              - '!**.md'
              - '!.agent/**'
              - '!LICENSE*'
            ios:
              - 'kioarch/src/commonMain/**'
              - 'kioarch/src/commonTest/**'
              - 'kioarch/src/iosMain/**'
              - 'kioarch/src/iosTest/**'
              - 'kioarch/src/cpp/**'
              - 'kioarch/src/nativeInterop/**'
              - 'kioarch/build.gradle.kts'
              - 'build-logic/**'
              - 'gradle/**'
            cpp:
              - 'kioarch/src/cpp/**'
              - 'build-logic/**'
              - 'gradle/**'
      - name: Check which jobs should run
        id: check
        run: |
          CODE_CHANGED="${{ steps.changed-files.outputs.code_any_changed }}"
          IOS_CHANGED="${{ steps.changed-files.outputs.ios_any_changed }}"
          CPP_CHANGED="${{ steps.changed-files.outputs.cpp_any_changed }}"

          RUN_LINT=false
          RUN_UNIT=false
          RUN_IOS=false
          RUN_INSTRUMENTATION=false
          RUN_BUILD=false
          RUN_CPP=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_LINT=true
            RUN_UNIT=true
            RUN_IOS=true
            RUN_INSTRUMENTATION=true
            RUN_BUILD=true
            RUN_CPP=true
          elif [ "$CODE_CHANGED" = "true" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              RUN_LINT=true
              RUN_UNIT=true
              RUN_IOS="$IOS_CHANGED"
              RUN_INSTRUMENTATION=false
              RUN_BUILD=true
              RUN_CPP="$CPP_CHANGED"
            elif [ "${{ github.event_name }}" = "push" ]; then
              if [ "${{ github.event.head_commit.committer.name }}" = "GitHub" ]; then
                # PR merge into main: only run Android emulator instrumentation tests
                RUN_INSTRUMENTATION=true
              else
                # Direct push to main
                RUN_LINT=true
                RUN_UNIT=true
                RUN_IOS="$IOS_CHANGED"
                RUN_INSTRUMENTATION=true
              fi
            fi
          fi

          echo "run-lint=$RUN_LINT" >> $GITHUB_OUTPUT
          echo "run-unit=$RUN_UNIT" >> $GITHUB_OUTPUT
          echo "run-ios=$RUN_IOS" >> $GITHUB_OUTPUT
          echo "run-instrumentation=$RUN_INSTRUMENTATION" >> $GITHUB_OUTPUT
          echo "run-build=$RUN_BUILD" >> $GITHUB_OUTPUT
          echo "run-cpp=$RUN_CPP" >> $GITHUB_OUTPUT

          echo "Decisions:"
          echo "  - run-lint: $RUN_LINT"
          echo "  - run-unit: $RUN_UNIT"
          echo "  - run-ios: $RUN_IOS"
          echo "  - run-instrumentation: $RUN_INSTRUMENTATION"
          echo "  - run-build: $RUN_BUILD"
          echo "  - run-cpp: $RUN_CPP"

  lint:
    needs: check-commit
    if: needs.check-commit.outputs.run-lint == 'true'
    uses: ./.github/workflows/lint.yml

  test:
    needs: check-commit
    if: >-
      needs.check-commit.outputs.run-unit == 'true' ||
      needs.check-commit.outputs.run-ios == 'true' ||
      needs.check-commit.outputs.run-instrumentation == 'true'
    uses: ./.github/workflows/test.yml
    with:
      run-unit: ${{ needs.check-commit.outputs.run-unit == 'true' }}
      run-ios: ${{ needs.check-commit.outputs.run-ios == 'true' }}
      run-instrumentation: ${{ needs.check-commit.outputs.run-instrumentation == 'true' }}

  build:
    needs: check-commit
    if: needs.check-commit.outputs.run-build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      run-cpp: ${{ needs.check-commit.outputs.run-cpp == 'true' }}

  allchecks:
    name: All Checks Passed
    needs: [check-commit, lint, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all checks passed
        run: |
          if [ "${{ needs.check-commit.result }}" != "success" ]; then
            echo "Error: check-commit job did not succeed (result: ${{ needs.check-commit.result }})."
            exit 1
          fi

          if [ "${{ needs.check-commit.outputs.run-lint }}" = "true" ] && \
             [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Error: lint job did not succeed (result: ${{ needs.lint.result }})."
            exit 1
          fi

          if { [ "${{ needs.check-commit.outputs.run-unit }}" = "true" ] || \
               [ "${{ needs.check-commit.outputs.run-ios }}" = "true" ] || \
               [ "${{ needs.check-commit.outputs.run-instrumentation }}" = "true" ]; } && \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "Error: test job did not succeed (result: ${{ needs.test.result }})."
            exit 1
          fi

          if [ "${{ needs.check-commit.outputs.run-build }}" = "true" ] && \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "Error: build job did not succeed (result: ${{ needs.build.result }})."
            exit 1
          fi

          echo "All required checks passed!"
