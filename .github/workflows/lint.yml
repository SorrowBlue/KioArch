name: Lint
on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: 🔍️ Detekt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@main
      - name: 🔍️ Run Detekt
        run: >
          ./gradlew detektAll
          -x compileJvmNatives -x compileWasmNatives -x compileIosNatives
          --continue
      - name: Upload SARIF (project)
        uses: github/codeql-action/upload-sarif@v4.39.3
        if: ${{ !cancelled() }}
        with:
          sarif_file: build/reports/detekt/merge.sarif
          category: detekt
      - name: Upload SARIF (build-logic)
        uses: github/codeql-action/upload-sarif@v4.39.3
        if: ${{ !cancelled() }}
        with:
          sarif_file: build-logic/build/reports/detekt/main.sarif
          category: detekt-build-logic

