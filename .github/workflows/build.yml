name: Build

on:
  workflow_call:

jobs:

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@main
      - name: Run publishToMavenLocal
        run: ./gradlew :kioarch:publishAndroidPublicationToMavenLocal :kioarch:android:publishToMavenLocal
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android
          path: ~/.m2/repository/
          retention-days: 1

  ios-build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          github-api-token: ${{ secrets.GITHUB_TOKEN }}
          cmake-version: '4.1.2'
      - name: Cache Kotlin/Native (Konan)
        uses: actions/cache@v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@main
      - name: Run publishToMavenLocal
        run: >
          ./gradlew
          :kioarch:publishIosArm64PublicationToMavenLocal
          :kioarch:publishIosSimulatorArm64PublicationToMavenLocal
          :kioarch:publishIosX64PublicationToMavenLocal
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios
          path: ~/.m2/repository/
          retention-days: 1


  native-binary-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          github-api-token: ${{ secrets.GITHUB_TOKEN }}
          cmake-version: '4.1.2'
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@main
      - name: Run compileJvmNatives
        run: ./gradlew :kioarch:compileJvmNatives
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: natives-${{ matrix.name }}
          path: kioarch/build/generated/natives/
          retention-days: 1

  jvm-build:
    needs: native-binary-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          github-api-token: ${{ secrets.GITHUB_TOKEN }}
          cmake-version: '4.1.2'
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@main
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: natives-**
          path: kioarch/build/generated/natives/
          merge-multiple: true
      - name: Run publishToMavenLocal
        run: ./gradlew publishJvmPublicationToMavenLocal -x compileJvmNatives
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jvm-allplatform
          path: ~/.m2/repository/
          retention-days: 1

  js-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          github-api-token: ${{ secrets.GITHUB_TOKEN }}
          cmake-version: '4.1.2'
      - name: Setup Emscripten (emsdk)
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: '5.0.7'
          actions-cache-folder: 'emsdk-cache'
          cache-key: 'emsdk-5.0.7-${{ runner.os }}-${{ runner.arch }}'
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@main
      - name: Run publishToMavenLocal
        run: ./gradlew publishJsPublicationToMavenLocal publishWasmJsPublicationToMavenLocal
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: js
          path: ~/.m2/repository/
          retention-days: 1
