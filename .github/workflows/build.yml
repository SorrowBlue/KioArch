name: Build

on:
  workflow_call:
    inputs:
      run-cpp:
        type: boolean
        default: true

jobs:

  android-and-sample-build:
    name: Android & Sample Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@main
      - name: Build Android AAR and Sample Modules
        run: >
          ./gradlew
          :kioarch:android:assembleRelease
          :sample:android:assembleDebug
          :sample:jvm:compileKotlinJvm
          :sample:web:compileKotlinWasmJs
          :sample:web:compileKotlinJs
          -x compileJvmNatives -x compileWasmNatives

  native-binary-build:
    name: Native Build (${{ matrix.name }})
    if: inputs.run-cpp
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          github-api-token: ${{ secrets.GITHUB_TOKEN }}
          cmake-version: 'v4.4.5'
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@main
      - name: Run compileJvmNatives
        run: ./gradlew :kioarch:compileJvmNatives
