name: Test

on:
  workflow_call:
    inputs:
      run-unit:
        type: boolean
        default: true
      run-ios:
        type: boolean
        default: true
      run-instrumentation:
        type: boolean
        default: false

jobs:

  unit-test:
    name: Unit Test
    if: inputs.run-unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          github-api-token: ${{ secrets.GITHUB_TOKEN }}
          cmake-version: '4.1.2'
      - name: Setup Emscripten (emsdk)
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: '5.0.7'
          actions-cache-folder: 'emsdk-cache'
          cache-key: 'emsdk-5.0.7-${{ runner.os }}-${{ runner.arch }}'
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@main
      - name: Run Unit Tests
        run: ./gradlew :kioarch:jvmTest :kioarch:testAndroidHostTest :kioarch:jsNodeTest :kioarch:wasmJsTest --continue
      - name: Upload Test Report
        if: cancelled() != true
        uses: dorny/test-reporter@v3.2.0
        with:
          name: 'Unit Test'
          path: '**/build/test-results/*/TEST-*.xml'
          reporter: 'java-junit'
          fail-on-error: false

  ios-test:
    name: iOS Test
    if: inputs.run-ios
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          github-api-token: ${{ secrets.GITHUB_TOKEN }}
          cmake-version: '4.1.2'
      - name: Cache Kotlin/Native (Konan)
        uses: actions/cache@v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@main
      - name: Run iOS Simulator Tests
        run: ./gradlew :kioarch:iosSimulatorArm64Test -Pios.simulatorOnly=true --continue
      - name: Upload Test Report
        if: cancelled() != true
        uses: dorny/test-reporter@v3.2.0
        with:
          name: 'iOS Test'
          path: '**/build/test-results/*/TEST-*.xml'
          reporter: 'java-junit'
          fail-on-error: false

  instrumentation-test:
    name: Instrumentation Test
    if: inputs.run-instrumentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@main
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache Gradle Managed Devices AVD & System Image
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.android/avd/gradle-managed
            ${{ env.ANDROID_HOME }}/system-images/android-35
          key: gmd-avd-35-x86_64-v1
      - name: Run Instrumentation Tests (Gradle Managed Devices)
        run: >
          ./gradlew
          :kioarch:pixel7ProApi35AndroidDeviceTest
          :sample:android:pixel7ProApi35DebugAndroidTest
          -Pandroid.experimental.testOptions.managedDevices.emulator.gpu=swiftshader_indirect
          --continue
      - name: Upload Test Report
        if: cancelled() != true
        uses: dorny/test-reporter@v3.2.0
        with:
          name: 'Instrumentation Test'
          path: '**/build/outputs/*Test-results/**/TEST-*.xml'
          reporter: 'java-junit'
          fail-on-error: false
